<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 165" width="100%">
  <defs>
    <style>
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .cursor { animation: blink 1.1s step-end infinite; }
    </style>
  </defs>

  <!-- Terminal background -->
  <rect width="800" height="165" rx="10" fill="#0d1117"/>

  <!-- Title bar -->
  <rect width="800" height="34" rx="10" fill="#161b22"/>
  <rect y="20" width="800" height="14" fill="#161b22"/>

  <!-- Traffic lights -->
  <circle cx="22" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="17" r="6" fill="#27c93f"/>

  <!-- Window title -->
  <text x="400" y="17" text-anchor="middle" dominant-baseline="middle"
        font-family="'Fira Code','Courier New',monospace" font-size="12" fill="#8b949e">
    lalit@github: ~/profile
  </text>

  <!-- Divider line -->
  <line x1="0" y1="34" x2="800" y2="34" stroke="#30363d" stroke-width="1"/>

  <!-- Line 1: whoami command -->
  <text x="22" y="66" font-family="'Fira Code','Courier New',monospace" font-size="14" fill="#3fb950">❯</text>
  <text x="42" y="66" font-family="'Fira Code','Courier New',monospace" font-size="14" fill="#e6edf3">whoami</text>

  <!-- Line 2: name output -->
  <text x="22" y="95" font-family="'Fira Code','Courier New',monospace" font-size="21"
        fill="#9D4EDD" font-weight="bold">Lalit Shrotriya</text>

  <!-- Line 3: description -->
  <text x="22" y="118" font-family="'Fira Code','Courier New',monospace" font-size="13" fill="#8b949e">
    Senior Data Scientist  ·  AI Researcher  ·  CFA L1 Candidate
  </text>

  <!-- Line 4: tags -->
  <text x="22" y="148" font-family="'Fira Code','Courier New',monospace" font-size="13" fill="#3fb950">❯</text>
  <text x="42" y="148" font-family="'Fira Code','Courier New',monospace" font-size="13" fill="#58a6ff">agentic-ai</text>
  <text x="138" y="148" font-family="'Fira Code','Courier New',monospace" font-size="13" fill="#58a6ff">  rag</text>
  <text x="186" y="148" font-family="'Fira Code','Courier New',monospace" font-size="13" fill="#58a6ff">  llms</text>
  <text x="234" y="148" font-family="'Fira Code','Courier New',monospace" font-size="13" fill="#58a6ff">  research</text>
  <text x="324" y="148" font-family="'Fira Code','Courier New',monospace" font-size="13" fill="#58a6ff">  open-source</text>
  <text x="454" y="148" font-family="'Fira Code','Courier New',monospace" font-size="13" fill="#58a6ff">  cfa-l1</text>

  <!-- Blinking cursor -->
  <rect x="535" y="135" width="9" height="15" fill="#9D4EDD" class="cursor"/>
</svg>
